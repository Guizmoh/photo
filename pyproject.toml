[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "naturaw"
version = "0.1.0"
description = "Debruitage naturel, deflou de bouge et redressement automatique pour fichiers RAW"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "opencv-python-headless>=4.7",
    "rawpy>=0.18",
    "tifffile>=2023.1",
    "imageio>=2.25",
]

[project.optional-dependencies]
# metadonnees : lecture de l'EXIF des RAW et ecriture dans les JPEG produits
metadonnees = ["exifread>=3.0", "piexif>=1.1"]
dev = ["pytest>=7.0", "exifread>=3.0", "piexif>=1.1"]

[project.scripts]
naturaw = "naturaw.cli:main"

[tool.setuptools]
packages = ["naturaw"]

[tool.setuptools.package-data]
naturaw = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
